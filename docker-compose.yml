services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: file:/app/data/digest.db
    volumes:
      - digest-data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 40s
    # Host CLI option (TN-0005 §5): mount Cursor CLI + repo MCP path, then set CURSOR_CLI_PATH.
    # volumes:
    #   - /usr/local/bin/agent:/usr/local/bin/agent:ro
    #   - ./apps/mcp-server:/app/mcp-server:ro
    # environment:
    #   CURSOR_CLI_PATH: /usr/local/bin/agent

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file:
      - .env
    environment:
      PORTAL_URL: http://web:3000
      DATABASE_URL: file:/app/data/digest.db
    volumes:
      - digest-data:/app/data
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  digest-data:
